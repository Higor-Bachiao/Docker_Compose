name: lab10-pgadmin-compose

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede-lab10

  pgadmin:
    image: dpage/pgadmin4:8
    env_file: .env
    environment:
      # SERVER_MODE fica no padrão (True): é o modo correto quando o
      # pgAdmin roda num container exposto por porta, não em uso desktop local.
      # ".local" não passa na checagem padrão de "e-mail entregável" do pgAdmin
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    # DESAFIO P10: healthcheck HTTP do proprio pgAdmin. /misc/ping responde
    # "PING" sem precisar de login. start_period cobre os ~20-40s de boot.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-lab10

  # DESAFIO P10: servico "ficticio" que so faz sentido com o pgAdmin pronto
  # (um monitor que bate no ping a cada 15s e registra no log).
  monitor:
    image: busybox:latest
    command: ["sh", "-c", "while true; do echo \"$$(date +%T) pgadmin respondeu: $$(wget -qO- http://pgadmin/misc/ping)\"; sleep 15; done"]
    depends_on:
      pgadmin:
        condition: service_healthy
    networks:
      - rede-lab10

volumes:
  pgdata:
  pgadmin_data:

networks:
  rede-lab10:
    driver: bridge
