name: lab08-compose-fundamentos

services:
  apache:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - ./apache/site:/usr/local/apache2/htdocs
      - ./apache/conf/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      - rede-lab08

  backend:
    build: ./backend
    # DESAFIO P08 (b): o Compose testa /status de dentro do container.
    # node:20-alpine nao tem curl, mas tem o wget do busybox.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - rede-lab08

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    # DESAFIO P08 (a): variavel de ambiente com valor padrao. Se NGINX_HOST
    # existir no shell/.env, ela vence; senao vale "sd-higor.local".
    environment:
      NGINX_HOST: ${NGINX_HOST:-sd-higor.local}
    volumes:
      - ./nginx/site:/usr/share/nginx/html:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy   # so sobe o proxy com a API respondendo
    networks:
      - rede-lab08

networks:
  rede-lab08:
    driver: bridge
